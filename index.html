<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes from the terminal</title>
    <meta name="description" content="A blog about code, written like one." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#141824" />
    <!--
      GitHub Pages serves static files only, so a direct load of a route like
      /blog/hello-world/ would 404. public/404.html catches that, encodes the
      intended path into a query string, and redirects to this file. This
      script runs first and rewrites the URL back before React Router mounts,
      so the browser's address bar shows the clean path throughout.
      Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
