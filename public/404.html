<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Notes from the terminal</title>
    <!--
      GitHub Pages serves this for any path it doesn't recognize as a real
      file (e.g. a direct load or refresh of /blog/hello-world/). It encodes
      the requested path into a query string and redirects to the real
      index.html, which decodes it back (see index.html) so React Router
      can take over and render the right page.
      Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var segmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
